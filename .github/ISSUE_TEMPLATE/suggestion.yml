name: "💡 Suggestion"
description: Improve a risk or propose new content.
labels: ["enhancement"]
body:
  - type: dropdown
    id: risk
    attributes:
      label: Which risk?
      options:
        - Risk 01 — Hardware & Firmware Integrity Compromise
        - Risk 02 — Network & Interconnect Vulnerabilities
        - Risk 03 — Unsafe Multi-Tenant Isolation and Resource Reuse
        - Risk 04 — Insecure Out-of-Band Management Plane
        - Risk 05 — AI Infrastructure Supply Chain Compromise
        - Risk 06 — Insecure Facility & Data Center Management Systems
        - Risk 07 — Insecure Data and Artifact Handling
        - Risk 08 — Certification Gaps & Provider Transparency Failures
        - Risk 09 — Insecure Operational Infrastructure Services
        - Risk 10 — Vendor Embargo Gaps & Patch Velocity Failures
        - General / more than one risk
        - New content (mapping, section, or risk)
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Supporting references
      description: CVEs, standards, vendor documentation, or research. Links preferred.
